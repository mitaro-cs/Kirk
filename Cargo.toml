[workspace]
resolver = "2"
members = ["crates/kirk-core", "crates/kirk-bridge", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["mitaro-cs"]

[workspace.dependencies]
kirk-core = { path = "crates/kirk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
